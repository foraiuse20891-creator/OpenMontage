
name: OpenMontage Cloud Demo Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        working-directory: remotion-composer
        run: npm ci

      - name: Render zero-key demo
        run: python render_demo.py

      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-demo-videos
          path: projects/demos/renders/*.mp4
          if-no-files-found: error
          retention-days: 7
